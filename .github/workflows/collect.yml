# 脆弱性収集 + GitHub Pages デプロイ ワークフロー
#
# スケジュール: 毎朝 JST 8:00 (UTC 23:00) に自動実行（収集 → デプロイ）
# push:        main ブランチへの push でサイトだけ再ビルド・デプロイ（収集はスキップ）
# 手動実行:    GitHub の Actions タブから "Run workflow" で任意のタイミングで実行可能（収集 → デプロイ）
#
# Secrets（Settings > Secrets and variables > Actions）— どれも任意:
#   - NVD_API_KEY    : NVD API キー（https://nvd.nist.gov/developers/request-an-api-key）。あると取得が速く安定する
#   ※ 依存パッケージの照合・ステータス・設定はブラウザ内（localStorage）で行うので、ここでは扱わない
#
# GitHub Pages の設定 (Settings > Pages):
#   - Source: GitHub Actions を選択

name: Collect & Deploy

on:
  schedule:
    # UTC 23:00 = JST 08:00
    - cron: "0 23 * * *"
  # main への push でサイトを再デプロイ
  # （Actions 自身の自動コミットは GITHUB_TOKEN で push されるため、ここは再発火しない）
  push:
    branches: [main]
  # 手動トリガー（テスト・緊急実行用）
  workflow_dispatch:

# 同時に複数のデプロイが走らないようにする（実行中のものは途中で止めない）
concurrency:
  group: pages
  cancel-in-progress: false

# GitHub Pages へのデプロイに必要な権限
permissions:
  contents: write # data/ への自動コミット用
  pages: write # GitHub Pages デプロイ用
  id-token: write # OIDC トークン（Pages デプロイに必要）

jobs:
  # ----------------------------------------------------------------
  # Job 1: ニュース収集 → Markdown 保存 → Git コミット
  # ----------------------------------------------------------------
  collect:
    name: Collect vulnerabilities
    # push 時は収集せず、デプロイだけ行う
    if: github.event_name != 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 自動コミット用に fetch-depth を 0 にする
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      # 機械翻訳モデル（FuguMT, 約 100MB）を毎回ダウンロードしないようキャッシュする
      - name: Cache translation model
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-fugumt-en-ja-v1

      - name: Run collector
        run: npm run collect
        env:
          # GitHub Advisory API のレート制限緩和用（自動で発行されるトークン）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          HF_CACHE_DIR: .hf-cache

      - name: Check for changes
        id: changes
        run: |
          # 新規ファイル（未追跡）も検出するため status を使う
          if [ -n "$(git status --porcelain data/)" ]; then echo "has_changes=true" >> "$GITHUB_OUTPUT"; fi

      - name: Commit and push collected data
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: collect vulnerabilities $(date +'%Y-%m-%d')"
          # 収集中に main へ push があっても失敗しないよう、最新を取り込んでから push する
          git pull --rebase
          git push

  # ----------------------------------------------------------------
  # Job 2: Astro ビルド → Pages 用アーティファクトのアップロード
  # collect ジョブが成功した後（push 時は collect がスキップされた後）に実行する
  # ----------------------------------------------------------------
  build:
    name: Build site
    needs: collect
    if: ${{ !cancelled() && (needs.collect.result == 'success' || needs.collect.result == 'skipped') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # collect ジョブのコミットを含めるために pull する
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build Astro site
        run: npm run build:site

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  # ----------------------------------------------------------------
  # Job 3: GitHub Pages へデプロイ
  # アップロードと同じジョブでデプロイすると、アーティファクトが一覧に
  # 反映される前に探しに行って "No artifacts named github-pages" で
  # 失敗することがあるため、ジョブを分ける（GitHub 公式テンプレートと同じ構成）
  # ----------------------------------------------------------------
  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
